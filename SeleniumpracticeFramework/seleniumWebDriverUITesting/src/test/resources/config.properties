#######################################################
# Global Framework Configuration
#######################################################

# Application URLs
baseURL=https://testautomationpractice.blogspot.com/
downloadFilesURL=https://testautomationpractice.blogspot.com/p/download-files_25.html

# Expected page title (used for title validation test)
expectedHomeTitle=Automation Testing Practice

# Browser: edge (this project runs Edge only)
browser=edge

# OPTIONAL: explicit path to the Edge executable, only needed if Selenium
# cannot auto-detect Edge on this machine (e.g. non-default install path,
# or a server OS where the browser isn't registered normally).
# Leave blank to let Selenium Manager auto-detect the installed browser.
# Example Edge: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
edgeBinaryPath=

# OPTIONAL: explicit path to a manually downloaded msedgedriver.exe binary.
# Set this if WebDriverManager's automatic driver download fails (e.g. this
# machine cannot resolve msedgedriver.azureedge.net, the Microsoft driver CDN,
# even though general internet access works - common on some VMs/corporate networks).
# Download the matching version from:
#   https://developer.microsoft.com/en-us/microsoft-edge/tools/webdriver/
# and point this at the extracted msedgedriver.exe. Leave blank to use WebDriverManager
# as normal.
# Example: C:\Tools\edgedriver\msedgedriver.exe
edgeDriverPath=

# Run mode: true = headless, false = headed
headless=false

# Timeouts (seconds)
implicitWait=10
explicitWait=20
pageLoadTimeout=30

# Directories (relative to project root)
downloadDir=downloads
screenshotDir=screenshots
extentReportDir=test-output/ExtentReport
testDataExcelPath=testdata/TestData.xlsx

# Text to type into "Enter Text" box on Download Files page before generating files
sampleTextToGenerate=Selenium Practice Automation - Sample Content
